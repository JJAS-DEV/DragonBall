<div  class="d-flex justify-content-center flex-wrap mt-2 align-items-center">
  <nav aria-label="Page navigation">
    <ul class="pagination flex-wrap custom-pagination mb-0">
      <!-- Primera página -->
      <li class="page-item" [class.disabled]="paginador.currentPage === 1">
        <a class="page-link" [routerLink]="[url + 1]" aria-label="First">
          <<
        </a>
      </li>

      <!-- Anterior -->
      <li class="page-item" [class.disabled]="paginador.currentPage === 1">
        <a class="page-link" [routerLink]="[url + (paginador.currentPage - 1)]" aria-label="Previous">
          &laquo;
        </a>
      </li>

      <!-- Páginas visibles -->
      @for(pagina of visiblePages; track $index) {
        <li class="page-item" [class.active]="pagina === paginador.currentPage">
          <a class="page-link" [routerLink]="[url + pagina]">{{ pagina }}</a>
        </li>
      }

      <!-- Siguiente -->
      <li class="page-item" [class.disabled]="paginador.currentPage === paginador.totalPages">
        <a class="page-link" [routerLink]="[url + (paginador.currentPage + 1)]" aria-label="Next">
          &raquo;
        </a>
      </li>

      <!-- Última página -->
      <li class="page-item" [class.disabled]="paginador.currentPage === paginador.totalPages">
        <a class="page-link" [routerLink]="[url + paginador.totalPages]" aria-label="Last">
          >>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Dropdown alineado al lado del paginador -->
  <div class="dropdown ms-2">
    <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
      {{ numberitems }}
    </button>
    <ul class="dropdown-menu">
      @for(item of opcionesGenero; track $index) {
        <li>
          <a class="dropdown-item" (click)="seleccion_numberitems(item)">
            {{ item }}
          </a>
        </li>
      }
    </ul>
  </div>
</div>
